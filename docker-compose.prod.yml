version: '3.9'

# Production deployment for a Hostinger VPS (KVM 2 or larger).
# Usage on the server:
#   1. git clone (or upload) this repo
#   2. cp .env.example .env  &&  fill in real secrets
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy
#   5. docker compose -f docker-compose.prod.yml exec api npx prisma db seed

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports exposed to the host — only reachable from other containers
    # on this compose network. Do not publish 5432 on a production box.

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: production
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # Selects the API connection pool (DB_POOL_API) in PrismaService.
      PROCESS_ROLE: api
      # One process runs the dispatcher. When you scale API replicas past 1,
      # set this to false here and run the `scheduler` service below instead.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/v1/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Not published directly — Nginx is the only public entry point.

  # Scheduled-update workers. A SEPARATE container from the API on purpose:
  # its own CPU, its own Postgres pool, its own Redis connection. A 2,000-job
  # fan-out here cannot slow down a login over there.
  #
  # Scale with:  docker compose -f docker-compose.prod.yml up -d --scale worker=3
  # Every replica shares the queue's rate limiter, so total throughput stays
  # bounded by QUEUE_RATE_LIMIT_MAX no matter how many you run.
  worker:
    build:
      context: ./apps/api
      target: production
    restart: always
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # Selects the smaller worker pool (DB_POOL_WORKER).
      PROCESS_ROLE: worker
      # Workers never dispatch; they only consume.
      SCHEDULER_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A worker exhausting the box would starve the API, so cap it. Tune once
    # you have measured a real cycle.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # No ports. Nothing should be able to reach a worker.

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run manually the first time (see README "HTTPS setup"), then this
    # entrypoint keeps the certificate renewed every 12 hours.
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
