[project]
name = "futurefashion-backend"
version = "1.0.0"
description = "Server for the Future Fashion referral app: auth, Telegram verification, referrals, ledger, withdrawals and admin."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "redis>=8.1",
    "argon2-cffi>=25.1",
    "cryptography>=50",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "pyotp>=2.10",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["**/templates/*.html", "**/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "UP040"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"migrations/*" = ["E501"]
