{% extends "base.html" %}
{% block title %}Audit log{% endblock %}
{% block content %}
<h1>Audit log</h1>
<table><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr>
{% for a in rows %}<tr><td>{{ a.created_at|ist }}</td><td>{{ a.actor }}</td><td>{{ a.action }}</td><td class="muted">{{ a.target or "" }}</td><td class="muted">{{ a.details }}</td></tr>{% endfor %}
</table>
{% endblock %}
