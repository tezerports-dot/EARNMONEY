# /etc/nginx/sites-available/referral
#
# Plain HTTP to start with. Run certbot afterwards (see README) — it rewrites
# this file in place and adds the TLS server block and the redirect.

upstream referral_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Modest rate limits: the admin login and the public search are the only
# endpoints a stranger can reach, and neither needs to be fast under load.
limit_req_zone $binary_remote_addr zone=referral_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=referral_general:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name referral.example.com;

    client_max_body_size 2m;

    access_log /var/log/nginx/referral.access.log;
    error_log  /var/log/nginx/referral.error.log;

    # Static assets are served straight off disk.
    location /static/ {
        alias /opt/referral/app/static/;
        expires 7d;
        access_log off;
    }

    location = /admin/login {
        limit_req zone=referral_login burst=5 nodelay;
        proxy_pass http://referral_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=referral_general burst=30 nodelay;
        proxy_pass http://referral_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
