worker_processes auto;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  client_max_body_size 10m;

  # Single-domain setup (works with a free subdomain like DuckDNS/FreeDNS/No-IP).
  # Everything routes off ONE hostname using paths instead of subdomains:
  #   https://YOURDOMAIN/            -> public website
  #   https://YOURDOMAIN/admin       -> admin panel (already part of the same Next.js app)
  #   https://YOURDOMAIN/webhook     -> Telegram bot webhook
  #
  # Set BOT_WEBHOOK_URL=https://YOURDOMAIN in your .env (no /webhook suffix —
  # the bot code appends /webhook itself), and NEXT_PUBLIC_SITE_URL=https://YOURDOMAIN.
  server {
    listen 80 default_server;
    server_name _;

    # Reserved path Certbot uses to prove domain ownership (webroot method) —
    # this lets you obtain/renew an HTTPS certificate later with zero downtime.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Telegram bot webhook
    location /webhook {
      proxy_pass http://bot:3001/webhook;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (public site + /admin, both served by the same Next.js app)
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
